// Every scalar type proto3 has, without presence, with it, packed, and not.
syntax = "proto3";

package test.scalars;

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;

  optional int32 o_int32 = 16;
  optional string o_string = 17;
  optional double o_double = 18;
  optional bool o_bool = 19;
  optional bytes o_bytes = 20;

  repeated double r_double = 21;
  repeated float r_float = 22;
  repeated int32 r_int32 = 23;
  repeated int64 r_int64 = 24;
  repeated uint32 r_uint32 = 25;
  repeated uint64 r_uint64 = 26;
  repeated sint32 r_sint32 = 27;
  repeated sint64 r_sint64 = 28;
  repeated fixed32 r_fixed32 = 29;
  repeated fixed64 r_fixed64 = 30;
  repeated sfixed32 r_sfixed32 = 31;
  repeated sfixed64 r_sfixed64 = 32;
  repeated bool r_bool = 33;
  repeated string r_string = 34;
  repeated bytes r_bytes = 35;

  repeated int32 u_int32 = 41 [packed = false];
  repeated sint64 u_sint64 = 42 [packed = false];
  repeated double u_double = 43 [packed = false];
  repeated fixed32 u_fixed32 = 44 [packed = false];
}

// Scalars' repeated fields, each written the other way: packed where Scalars' aren't, and not
// where they are.
message Repacked {
  repeated int32 r_int32 = 23 [packed = false];
  repeated sint64 r_sint64 = 28 [packed = false];
  repeated int32 u_int32 = 41 [packed = true];
  repeated sint64 u_sint64 = 42 [packed = true];
  repeated double u_double = 43 [packed = true];
  repeated fixed32 u_fixed32 = 44 [packed = true];
}
