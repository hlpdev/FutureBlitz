// A custom option, which descriptor.proto's FieldOptions declares, and fb reads past: the file
// imports descriptor.proto only for the extend.
syntax = "proto3";

package kinds;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  string label = 50000;
}

message Item {
  string name = 1 [(label) = "Name"];
}
