# Version updates once a month, each ecosystem's in one pull request, as each runs CI on all three
# OSes; security updates come as soon as there's an advisory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    groups:
      vscode:
        patterns: ["*"]
    # @types/vscode follows package.json's engines.vscode, by hand, as a newer one lets code use
    # APIs the oldest VS Code the extension takes doesn't have; @types/node follows VS Code's
    # own Node's major.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, area/vscode]
    commit-message:
      prefix: editors/vscode

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, area/ci]
    commit-message:
      prefix: ci
