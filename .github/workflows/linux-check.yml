# A throwaway check of M8 step 1 on Linux, on its branch only: fb linking with its own lld.
name: Linux check

on:
  push:
    branches: [m8-toolchain]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y llvm-22-dev libclang-22-dev lld-22 libpolly-22-dev

      - name: Configure
        run: CC=gcc-14 CXX=g++-14 cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build build

      - name: The toolchain folder
        run: ls -la build/lib/linux-x64 | head -40; cat build/lib/linux-x64/libc.so

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure
