# Runs only the tests a fix touches, on each OS, as CI builds them, without the rest of CI's hours:
#
#   gh workflow run targeted.yml -f tests='fb mcp|lens resolves' -f bench=true
#
# `tests` is a ctest -R pattern; `bench` adds the LSP benchmark, enforced, as CI's job runs it.
name: Targeted

on:
  workflow_dispatch:
    inputs:
      tests:
        description: The tests to run, a ctest -R pattern
        required: true
        type: string
      bench:
        description: Run the LSP benchmark too
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            shell: msys2 {0}
          - name: Linux
            os: ubuntu-24.04
            shell: bash
          - name: macOS
            os: macos-15
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          Invoke-WebRequest $url -OutFile llvm.exe
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList '/S', '/D=C:\LLVM'
          "FB_CONFIGURE=-DFB_LLVM_ROOT=C:/LLVM" >> $env:GITHUB_ENV

      - name: Install the toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 patchelf
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y llvm-22-dev libclang-22-dev lld-22 libpolly-22-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "FB_CONFIGURE=-DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install the toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22 lld@22 || brew install ninja llvm lld
          prefix="$(brew --prefix llvm@22 2>/dev/null || brew --prefix llvm)"
          echo "FB_CONFIGURE=-DLLVM_DIR=$prefix/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug $FB_CONFIGURE

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          ctest --test-dir build -j 4 --output-on-failure -R "$TESTS" | tee ctest.log
          # A pattern that names nothing passes nothing.
          ! grep -q "No tests were found" ctest.log

  bench:
    name: LSP benchmark
    if: inputs.bench
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y llvm-22-dev libclang-22-dev lld-22 libpolly-22-dev

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          cmake --build build --target fb_lsp_tests

      - name: Benchmark
        env:
          FB_LSP_BENCH_ENFORCE: 1
          FB_LSP_BENCH_SLOWER: 1.6
        run: build/tests/fb_lsp_tests "[bench]"
