# Sends a published release (release.yml makes it a draft, which is published by hand) to the
# package managers, each only when it's ticked in the dispatch, and never on its own:
#
#   gh workflow run publish.yml -f version=1.0.0 -f winget=true -f homebrew=true -f linux=true \
#     -f vscode=true
#
# - winget: a pull request to microsoft/winget-pkgs of FutureBlitz.FutureBlitz's manifests, from
#   the fork WINGET_FORK (hlpdev/winget-pkgs), with WINGET_TOKEN.
# - homebrew: futureblitz.rb, pushed to HOMEBREW_TAP (hlpdev/homebrew-tap), with
#   HOMEBREW_TAP_TOKEN.
# - linux: the apt and dnf repositories, every release's .debs and .rpms, those in R2 and this
#   release's, signed with REPO_SIGNING_KEY, uploaded to the R2 bucket R2_BUCKET that
#   dl.futureblitz.dev serves, under apt/ and rpm/, with R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, and
#   R2_SECRET_ACCESS_KEY.
# - vscode: the .vsix, to the VS Code Marketplace with VSCE_PAT, and Open VSX with OVSX_PAT.
#
# Each takes the release's files from its GitHub Release, checked against its SHA256SUMS.
# docs/release-setup.md says where each secret and variable comes from.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The published release's version, like 1.0.0
        required: true
        type: string
      winget:
        description: Open a pull request to microsoft/winget-pkgs
        type: boolean
        default: false
      homebrew:
        description: Push the formula to the Homebrew tap
        type: boolean
        default: false
      linux:
        description: Update the apt and dnf repositories on dl.futureblitz.dev
        type: boolean
        default: false
      vscode:
        description: Publish the extension to the Marketplace and Open VSX
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}
  OVSX_VERSION: 1.3.0

jobs:
  # The version is a published release's.
  check:
    name: check the release
    runs-on: ubuntu-24.04
    steps:
      - name: Check
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The version is three numbers, like 1.0.0, not $VERSION"
            exit 1
          fi
          draft="$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          if [ "$draft" != false ]; then
            echo "::error::v$VERSION isn't a published release; publish its draft first"
            exit 1
          fi

  winget:
    name: winget
    needs: check
    if: inputs.winget
    runs-on: ubuntu-24.04
    env:
      FORK: ${{ vars.WINGET_FORK || 'hlpdev/winget-pkgs' }}
    steps:
      - uses: actions/checkout@v4

      - name: The manifests
        run: |
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D release
          python3 tools/release/packages.py winget "$VERSION" release/SHA256SUMS manifests
          cat manifests/*.yaml

      # The fork's master is upstream's, a branch of it gets the manifests, through the API, so
      # nothing clones winget-pkgs, and the pull request goes from it.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WINGET_TOKEN isn't set (docs/release-setup.md)"
            exit 1
          fi
          branch="futureblitz-$VERSION"
          folder="manifests/f/FutureBlitz/FutureBlitz/$VERSION"
          gh api -X POST "repos/$FORK/merge-upstream" -f branch=master > /dev/null
          if gh api "repos/$FORK/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "::error::$FORK has a branch $branch already; delete it, and its pull request, first"
            exit 1
          fi
          base="$(gh api "repos/$FORK/git/ref/heads/master" -q .object.sha)"
          gh api -X POST "repos/$FORK/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" > /dev/null
          for file in manifests/*.yaml; do
            gh api -X PUT "repos/$FORK/contents/$folder/${file##*/}" -f "branch=$branch" \
              -f "message=FutureBlitz.FutureBlitz $VERSION" -f "content=$(base64 -w0 "$file")" > /dev/null
          done
          gh pr create -R microsoft/winget-pkgs --base master --head "${FORK%%/*}:$branch" \
            --title "New version: FutureBlitz.FutureBlitz version $VERSION" \
            --body "FutureBlitz $VERSION, from https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION. The manifests are generated by tools/release/packages.py from the release's SHA256SUMS."

  homebrew:
    name: homebrew
    needs: check
    if: inputs.homebrew
    runs-on: ubuntu-24.04
    env:
      TAP: ${{ vars.HOMEBREW_TAP || 'hlpdev/homebrew-tap' }}
    steps:
      - uses: actions/checkout@v4

      - name: The formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN isn't set (docs/release-setup.md)"
            exit 1
          fi
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D release
          python3 tools/release/packages.py homebrew "$VERSION" release/SHA256SUMS futureblitz.rb
          ruby -c futureblitz.rb
          cat futureblitz.rb

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push it
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../futureblitz.rb Formula/futureblitz.rb
          git add Formula/futureblitz.rb
          if git diff --cached --quiet; then
            echo "The tap has this formula already"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "futureblitz $VERSION"
          git push

  # Every release's packages stay in the repositories: those R2 has already, and this one's.
  # Packages go up first and the indexes that name them last, so a client never reads an index
  # whose packages aren't there yet. apt's indexes are by-hash, which an InRelease names by their
  # hashes, so an InRelease and the indexes it gets always match; what changes isn't cached.
  linux:
    name: apt and dnf
    needs: check
    if: inputs.linux
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 takes the checksums S3 asks for only when they're required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID BUCKET REPO_SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name isn't set (docs/release-setup.md)"
              exit 1
            fi
          done
          echo "R2=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm
          aws --version

      - name: The release's packages, and those R2 has
        run: |
          set -eux
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm' -p SHA256SUMS -D new
          (cd new && sha256sum --ignore-missing -c SHA256SUMS && rm SHA256SUMS)
          aws s3 sync "s3://$BUCKET/apt/pool/" old/apt/ --endpoint-url "$R2" --exclude '*' --include '*.deb'
          aws s3 sync "s3://$BUCKET/rpm/packages/" old/rpm/ --endpoint-url "$R2" --exclude '*' --include '*.rpm'
          find old new -type f | sort

      - name: Make the repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -eu
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          python3 tools/release/repo.py site old new --key "$key"
          find site -type f | sort

      - name: Upload
        run: |
          set -eux
          sync() { aws s3 sync "$@" --endpoint-url "$R2" --no-progress; }
          put() { aws s3 cp "site/$1" "s3://$BUCKET/$1" --endpoint-url "$R2" --no-progress --cache-control "$2"; }
          forever="public, max-age=31536000, immutable"
          fresh="no-cache"
          # What never changes, under a name that's its version or its hash, cached for good: the
          # packages, apt's indexes by-hash, and createrepo_c's checksum-named files. Nothing is
          # deleted, so an older InRelease or repomd.xml still finds the files it names.
          sync site/apt/pool "s3://$BUCKET/apt/pool" --cache-control "$forever" --size-only
          sync site/rpm/packages "s3://$BUCKET/rpm/packages" --cache-control "$forever" --size-only
          sync site/apt/dists "s3://$BUCKET/apt/dists" --cache-control "$forever" --size-only \
            --exclude '*' --include '*/by-hash/*'
          sync site/rpm/repodata "s3://$BUCKET/rpm/repodata" --cache-control "$forever" --size-only \
            --exclude 'repomd.xml*'
          # What changes, never cached, so a client gets the files that go together: apt's plain
          # indexes, for clients without by-hash, the keys, and the .repo.
          sync site/apt/dists "s3://$BUCKET/apt/dists" --cache-control "$fresh" \
            --exclude '*Release*' --exclude '*/by-hash/*'
          for file in apt/futureblitz.gpg apt/futureblitz.asc rpm/futureblitz.asc rpm/futureblitz.repo; do
            put "$file" "$fresh"
          done
          # Last, what names the rest, each with its signature right after it: InRelease is one
          # file, signature and all, which is what apt reads; dnf reads repomd.xml, then its .asc.
          put apt/dists/stable/Release "$fresh"
          put apt/dists/stable/Release.gpg "$fresh"
          put apt/dists/stable/InRelease "$fresh"
          put rpm/repodata/repomd.xml "$fresh"
          put rpm/repodata/repomd.xml.asc "$fresh"

  vscode:
    name: vscode extension
    needs: check
    if: inputs.vscode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: The .vsix
        run: |
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "futureblitz-$VERSION.vsix" -p SHA256SUMS -D release
          (cd release && sha256sum --ignore-missing -c SHA256SUMS)

      # vsce is editors/vscode's own, pinned in its package-lock.json.
      - name: Publish to the Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT isn't set (docs/release-setup.md)"
            exit 1
          fi
          npm ci
          npx vsce publish --packagePath "$GITHUB_WORKSPACE/release/futureblitz-$VERSION.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT isn't set (docs/release-setup.md)"
            exit 1
          fi
          npx --yes "ovsx@$OVSX_VERSION" publish "release/futureblitz-$VERSION.vsix"
